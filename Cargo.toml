[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.27.0"
edition = "2024"
repository = "https://github.com/henryhchchc/mokapot"
license = "MIT"
keywords = ["analysis", "bytecode", "java", "jvm"]
categories = ["development-tools", "parsing"]

[workspace.dependencies]
anyhow = "1"
bitflags = "2.12"
clap = "4.6"
derive_more = "2.0"
divan = { package = "codspeed-divan-compat", version = "5.0.3" }
document-features = "0.2"
glob = "0.3"
itertools = "0.15"
petgraph = "0.8"
proptest = "1.11"
proptest-derive = "0.9"
thiserror = "2.0"
walkdir = "2.5"
zerocopy = { version = "0.8", features = ["derive"] }
zip = { version = "9", default-features = false }

[workspace.lints.clippy]
missing_const_for_fn = "warn"
pedantic = "warn"

[workspace.lints.rust]
future_incompatible = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.bench]
opt-level = 3
lto = true

[profile.jdk-smoke]
inherits = "test"
opt-level = 3
lto = true
