lints.workspace = true

[package]
name = "mokapot"
version.workspace = true
edition.workspace = true
description = "A library for parsing and analyzing JVM bytecode"
documentation = "https://docs.rs/mokapot"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
harness = false
name = "jdk-parsing"
required-features = ["bench-internals"]

[[bench]]
harness = false
name = "jdk-ir"

[[bench]]
harness = false
name = "jdk-path-conditions"

[dependencies]
bitflags = { workspace = true }
cesu8 = { workspace = true }
derive_more = { workspace = true, features = ["as_ref", "debug", "deref", "display", "from", "into"] }
document-features = { workspace = true }
itertools = { workspace = true }
petgraph = { workspace = true, optional = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
zerocopy = { workspace = true, features = ["simd", "std"] }
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"], optional = true }

[dev-dependencies]
clap = { workspace = true, features = ["derive"] }
divan.workspace = true
proptest = { workspace = true }
proptest-derive = { workspace = true }
walkdir = { workspace = true }

[build-dependencies]
anyhow.workspace = true
glob = { workspace = true }

[features]
default = ["jar", "petgraph"]
# Private parser adapters for the parsing benchmark target.
bench-internals = []
## Enables loading classes from `.jar` files
jar = ["dep:zip"]
## Enables graph analyses backed by `petgraph`.
petgraph = ["dep:petgraph"]
